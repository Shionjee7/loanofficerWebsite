<style>
  :root {
    /* Heritage Navy (default) — overridden by Tweaks */
    --ink:        #0B1726;
    --primary:    #0B2A4A;
    --primary-12: #0B2A4A1f;
    --accent:     #B6883E;
    --canvas:     #F6F2EA;
    --paper:      #FFFFFF;
    --muted:      #5E6B7A;
    --hairline:   #E5DDCB;
    --field:      #EFEADF;
    --good:       #1F6B47;

    --serif: "Newsreader", ui-serif, Georgia, serif;
    --sans:  "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono:  "Geist Mono", ui-monospace, monospace;

    --r-sm: 4px;
    --r:    8px;
    --r-lg: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  /* utility */
  .container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .h-display {
    font-family: var(--serif);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.02;
    color: var(--ink);
  }
  .h-section {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0;
  }
  .hairline { height: 1px; background: var(--hairline); border: 0; margin: 0; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    border-radius: var(--r);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: transform .08s ease, background .15s ease, border-color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: color-mix(in oklab, var(--primary), black 10%); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--hairline); }
  .btn-ghost:hover { background: var(--paper); }
  .btn-accent { background: var(--accent); color: #1A1306; }
  .btn-accent:hover { background: color-mix(in oklab, var(--accent), black 8%); }

  /* Inputs */
  .field {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: var(--r);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    width: 100%;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-12); }
  .label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  /* Card */
  .card {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .fade-up { animation: fadeUp .6s ease both; }

  /* Marquee */
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* Hide scrollbar on number inputs */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  /* ═══════════════════════════════════════════════════════════
     RESPONSIVE — 320px (iPhone SE) → 4K desktop
  ═══════════════════════════════════════════════════════════ */
  html { -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; }
  *, *::before, *::after { min-width: 0; }
  img, svg { max-width: 100%; }
  section, header, footer { overflow: hidden; }

  /* ── TABLET ≤1024px ── */
  @media (max-width: 1024px) {
    .h-section { font-size: 36px !important; }
  }

  /* ── SMALL TABLET ≤900px — stack 2-col layouts ── */
  @media (max-width: 900px) {
    .hero-grid    { grid-template-columns: 1fr !important; gap: 28px !important; }
    .hero-card    { order: 2; }                  /* card goes BELOW the text */
    .about-grid   { grid-template-columns: 1fr !important; gap: 40px !important; }
    .about-portrait { max-width: 260px !important; margin: 0 auto !important; }
    .calc-grid    { grid-template-columns: 1fr !important; gap: 24px !important; padding: 24px !important; }
    .apply-grid   { grid-template-columns: 1fr !important; gap: 32px !important; }
    .footer-grid  { grid-template-columns: 1fr !important; gap: 36px !important; }
    .products-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .process-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 24px !important; }
    .process-line { display: none !important; }
  }

  /* ── PHONE ≤640px — single column, comfortable spacing ── */
  @media (max-width: 640px) {
    .container    { padding: 0 18px; }
    .nav-links    { display: none !important; }
    .nav-phone-text { display: none !important; }
    .nav-apply    { display: none !important; }
    .nav-burger   { display: inline-flex !important; }
    .nav-inner    { height: 56px !important; }

    /* Center About section copy on phones */
    .about-grid > div:last-child { text-align: center; }
    .about-grid > div:last-child .h-section { text-align: center; margin-left: auto; margin-right: auto; }
    .about-grid > div:last-child p { margin-left: auto !important; margin-right: auto !important; }
    .about-bullets { justify-items: center; }
    .about-bullets li { justify-content: center; }
    .about-grid > div:last-child > div:last-child { justify-content: center !important; }
    .h-section    { font-size: 26px !important; line-height: 1.15 !important; }
    .h-display    { font-size: clamp(32px, 8.5vw, 42px) !important; }

    .products-grid  { grid-template-columns: 1fr !important; }
    .products-header { grid-template-columns: 1fr !important; }
    .products-header > a.btn { display: none !important; }
    .process-grid   { grid-template-columns: 1fr !important; gap: 20px !important; }
    .about-bullets  { grid-template-columns: 1fr !important; gap: 12px !important; }
    .footer-bottom  { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; }

    /* Hero card — full width, proper padding */
    .hero-card      { padding: 24px !important; }
    .hero-card h2   { font-size: 22px !important; }

    /* Section padding */
    #top        { padding: 32px 0 48px !important; }
    #loans      { padding: 56px 0 48px !important; }
    #about      { padding: 56px 0 !important; }
    #process    { padding: 56px 0 !important; }
    #calculator { padding: 56px 0 !important; }
    #apply      { padding: 56px 0 !important; }
    footer      { padding-top: 48px !important; padding-bottom: 24px !important; }

    /* Apply card */
    #apply .card   { padding: 28px !important; }
    #apply .card h3 { font-size: 26px !important; }
  }

  /* ── SMALL PHONE ≤420px — iPhone SE / mini ── */
  @media (max-width: 420px) {
    .container  { padding: 0 14px; }
    .h-section  { font-size: 24px !important; }
    .btn        { padding: 12px 14px !important; font-size: 13.5px !important; }
  }

  /* ── Touch devices — bigger tap targets ── */
  @media (hover: none) and (pointer: coarse) {
    .btn { min-height: 48px; }
  }
</style>
